name: Build Signed Noor APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================
      # 1. Combine the 4 ZIP parts
      # ==============================
      - name: Combine ZIP parts
        shell: bash
        run: |
          set -e

          cat nour_offline_full_delivery.zip.part1 \
              nour_offline_full_delivery.zip.part2 \
              nour_offline_full_delivery.zip.part3 \
              nour_offline_full_delivery.zip.part4 \
              > nour_offline_full_delivery.zip

          unzip -t nour_offline_full_delivery.zip
          ls -lh nour_offline_full_delivery.zip

      # ==============================
      # 2. Extract project
      # ==============================
      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q nour_offline_full_delivery.zip -d extracted

      # ==============================
      # 3. Find Flutter project
      # ==============================
      - name: Find Flutter project
        id: project
        shell: bash
        run: |
          PUBSPEC=$(find extracted -name pubspec.yaml -type f | head -1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ==============================
      # 4. Java
      # ==============================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==============================
      # 5. Flutter
      # ==============================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # ==============================
      # 6. Fix Android desugaring
      # ==============================
      - name: Fix Android desugaring
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ]

          gradle = next((x for x in files if x.exists()), None)

          if gradle is None:
              raise SystemExit("Android app Gradle file not found")

          text = gradle.read_text(encoding="utf-8")

          print("Using:", gradle)

          if gradle.name.endswith(".kts"):

              if "isCoreLibraryDesugaringEnabled = true" not in text:

                  m = re.search(r'compileOptions\s*\{', text)

                  if m:
                      p = m.end()
                      text = (
                          text[:p]
                          + "\n        isCoreLibraryDesugaringEnabled = true"
                          + text[p:]
                      )
                  else:
                      m = re.search(r'android\s*\{', text)

                      if not m:
                          raise SystemExit("android block not found")

                      p = m.end()

                      text = text[:p] + '''
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              ''' + text[p:]

              if "coreLibraryDesugaring(" not in text:

                  dep = (
                      'coreLibraryDesugaring('
                      '"com.android.tools:desugar_jdk_libs:2.1.4")'
                  )

                  m = re.search(r'dependencies\s*\{', text)

                  if m:
                      p = m.end()
                      text = text[:p] + "\n    " + dep + text[p:]
                  else:
                      text += "\n\ndependencies {\n    " + dep + "\n}\n"

          else:

              if (
                  "coreLibraryDesugaringEnabled true" not in text
                  and "coreLibraryDesugaringEnabled = true" not in text
              ):

                  m = re.search(r'compileOptions\s*\{', text)

                  if m:
                      p = m.end()
                      text = (
                          text[:p]
                          + "\n        coreLibraryDesugaringEnabled true"
                          + text[p:]
                      )

                  else:
                      m = re.search(r'android\s*\{', text)

                      if not m:
                          raise SystemExit("android block not found")

                      p = m.end()

                      text = text[:p] + '''
              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              ''' + text[p:]

              if not re.search(
                  r'^\s*coreLibraryDesugaring\s+[\'"]',
                  text,
                  flags=re.MULTILINE
              ):

                  dep = (
                      "coreLibraryDesugaring "
                      "'com.android.tools:desugar_jdk_libs:2.1.4'"
                  )

                  m = re.search(r'dependencies\s*\{', text)

                  if m:
                      p = m.end()
                      text = text[:p] + "\n    " + dep + text[p:]
                  else:
                      text += "\n\ndependencies {\n    " + dep + "\n}\n"

          gradle.write_text(text, encoding="utf-8")

          print("Desugaring patch completed.")
          PY

      # ==============================
      # 7. Dependencies
      # ==============================
      - name: Flutter dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          flutter clean
          flutter pub get

      # ==============================
      # 8. Build APK
      # ==============================
      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          flutter build apk --release

      # ==============================
      # 9. Find Android SDK build tools
      # ==============================
      - name: Find Android build tools
        id: android_tools
        shell: bash
        run: |
          BUILD_TOOLS=$(find "$ANDROID_SDK_ROOT/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)

          echo "Build tools: $BUILD_TOOLS"

          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"

          echo "path=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"

      # ==============================
      # 10. Create signing key
      # ==============================
      - name: Create release signing key
        shell: bash
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/noor-release.jks" \
            -storepass "NoorBuild2026" \
            -keypass "NoorBuild2026" \
            -alias noor \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Noor, OU=Mobile, O=Noor, L=Cairo, ST=Cairo, C=EG"

      # ==============================
      # 11. Prepare APK
      # ==============================
      - name: Zipalign APK
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project_dir }}"

          APK="$PROJECT/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not found:"
            find "$PROJECT/build" -name "*.apk" -print || true
            exit 1
          fi

          "${{ steps.android_tools.outputs.path }}/zipalign" \
            -f \
            -v \
            4 \
            "$APK" \
            "$RUNNER_TEMP/Noor-aligned.apk"

      # ==============================
      # 12. Sign APK
      # ==============================
      - name: Sign APK
        shell: bash
        run: |
          "${{ steps.android_tools.outputs.path }}/apksigner" sign \
            --ks "$RUNNER_TEMP/noor-release.jks" \
            --ks-key-alias noor \
            --ks-pass pass:NoorBuild2026 \
            --key-pass pass:NoorBuild2026 \
            --out "$RUNNER_TEMP/Noor.apk" \
            "$RUNNER_TEMP/Noor-aligned.apk"

      # ==============================
      # 13. Verify signature
      # ==============================
      - name: Verify APK signature
        shell: bash
        run: |
          echo "Checking APK signature..."

          "${{ steps.android_tools.outputs.path }}/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$RUNNER_TEMP/Noor.apk"

          echo "APK signature verified successfully."

      # ==============================
      # 14. Verify ZIP/APK integrity
      # ==============================
      - name: Verify APK integrity
        shell: bash
        run: |
          unzip -t "$RUNNER_TEMP/Noor.apk"

          ls -lh "$RUNNER_TEMP/Noor.apk"

      # ==============================
      # 15. Upload final APK
      # ==============================
      - name: Upload signed Noor APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Signed-APK
          path: ${{ runner.temp }}/Noor.apk
          if-no-files-found: error
          retention-days: 30
