name: Build Noor APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Combine ZIP parts
        shell: bash
        run: |
          set -e

          echo "Combining project parts..."

          cat nour_offline_full_delivery.zip.part1 \
              nour_offline_full_delivery.zip.part2 \
              nour_offline_full_delivery.zip.part3 \
              nour_offline_full_delivery.zip.part4 \
              > nour_offline_full_delivery.zip

          echo "ZIP created:"
          ls -lh nour_offline_full_delivery.zip

      - name: Test ZIP
        run: |
          unzip -t nour_offline_full_delivery.zip

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q nour_offline_full_delivery.zip -d extracted

          echo "Project files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Flutter project
        id: project
        shell: bash
        run: |
          PUBSPEC=$(find extracted -name pubspec.yaml -type f | head -1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: |
          flutter --version
          flutter doctor -v

      - name: Fix Android desugaring
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          gradle = next((p for p in candidates if p.exists()), None)

          if gradle is None:
              raise SystemExit(
                  "ERROR: android/app/build.gradle or build.gradle.kts not found"
              )

          text = gradle.read_text(encoding="utf-8")

          print("Patching:", gradle)

          if gradle.suffix == ".kts":
              # Kotlin DSL
              if "isCoreLibraryDesugaringEnabled = true" not in text:
                  match = re.search(r'compileOptions\s*\{', text)

                  if match:
                      pos = match.end()
                      text = (
                          text[:pos]
                          + "\n        isCoreLibraryDesugaringEnabled = true"
                          + text[pos:]
                      )
                  else:
                      match = re.search(r'android\s*\{', text)

                      if not match:
                          raise SystemExit("ERROR: android block not found")

                      pos = match.end()
                      text = (
                          text[:pos]
                          + '''
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              '''
                          + text[pos:]
                      )

              if "coreLibraryDesugaring(" not in text:
                  dependency = (
                      'coreLibraryDesugaring('
                      '"com.android.tools:desugar_jdk_libs:2.1.4")'
                  )

                  match = re.search(r'dependencies\s*\{', text)

                  if match:
                      pos = match.end()
                      text = text[:pos] + "\n    " + dependency + text[pos:]
                  else:
                      text += "\n\ndependencies {\n    " + dependency + "\n}\n"

          else:
              # Groovy DSL
              if (
                  "coreLibraryDesugaringEnabled true" not in text
                  and "coreLibraryDesugaringEnabled = true" not in text
              ):
                  match = re.search(r'compileOptions\s*\{', text)

                  if match:
                      pos = match.end()
                      text = (
                          text[:pos]
                          + "\n        coreLibraryDesugaringEnabled true"
                          + text[pos:]
                      )
                  else:
                      match = re.search(r'android\s*\{', text)

                      if not match:
                          raise SystemExit("ERROR: android block not found")

                      pos = match.end()
                      text = (
                          text[:pos]
                          + '''
              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              '''
                          + text[pos:]
                      )

              if not re.search(
                  r'^\s*coreLibraryDesugaring\s+[\'"]',
                  text,
                  flags=re.MULTILINE,
              ):
                  dependency = (
                      "coreLibraryDesugaring "
                      "'com.android.tools:desugar_jdk_libs:2.1.4'"
                  )

                  match = re.search(r'dependencies\s*\{', text)

                  if match:
                      pos = match.end()
                      text = text[:pos] + "\n    " + dependency + text[pos:]
                  else:
                      text += "\n\ndependencies {\n    " + dependency + "\n}\n"

          gradle.write_text(text, encoding="utf-8")

          print("\n===== Patched Gradle file =====")
          print(text)
          PY

      - name: Get Flutter dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          flutter pub get

      - name: Clean project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          flutter clean
          flutter pub get

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          flutter build apk --release

      - name: Find generated APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "Generated APK files:"
          find build -type f -name "*.apk" -print

      - name: Upload Noor APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Release-APK
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
